<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>probe: logs</title>
</head>
<body>
<iframe id="app" src="index.html" style="width:100%;height:400px;border:1px solid #ccc"></iframe>
<script>
// Baliza inmediata: ¿corrió el script clásico?
navigator.sendBeacon('/bc?d=' + encodeURIComponent('BALIZA|script-clasico-corrio'));
// Watchdog (script clásico, corre aunque el módulo falle): si en 30 s no
// hubo reporte, reporta los errores capturados
window.__errs = [];
window.__reportado = false;
addEventListener('error', e => {
    window.__errs.push('err:' + (e.message || e.type) + (e.filename ? '@' + e.filename.split('/').pop() + ':' + e.lineno : ''));
}, true);
addEventListener('unhandledrejection', e => {
    window.__errs.push('rej:' + String(e.reason && e.reason.message || e.reason));
});
function reportar(pref) {
    if (window.__reportado) return;
    window.__reportado = true;
    const d = pref + (window.__errs.length ? ' | ERRORES: ' + window.__errs.join(' ;; ') : ' | sin errores JS capturados');
    navigator.sendBeacon('/bc?d=' + encodeURIComponent(d));
}
setTimeout(() => reportar('LOGS|TIMEOUT-30s'), 30000);
</script>
<script type="module">
import { log } from './js/logs.js';

// Baliza: el módulo importó logs.js correctamente
fetch('/bc?d=' + encodeURIComponent('BALIZA|modulo-importo-logs'));
window.__modOK = true;
const r = [];
async function check(nombre, fn) {
    try {
        r.push(((await fn()) ? 'OK  ' : 'FAIL') + ': ' + nombre);
    } catch (e) {
        r.push('FAIL: ' + nombre + ' (' + e.message + ')');
    }
}

const esperar = (ms) => new Promise(res => setTimeout(res, ms));

// Esperar a que la app real (iframe) cargue su cadena de imports
const f = document.getElementById('app');
await Promise.race([
    new Promise(res => { f.onload = res; }),
    esperar(9000)
]);
await esperar(2000);

await check('__logs global existe (imports de logs.js OK)', async () =>
    typeof globalThis.__logs === 'object');
await check('app real cargó en iframe (main.js y cadena completa OK)', async () =>
    !!(f.contentWindow && f.contentWindow.__logs));
await check('app registró carga-pagina (en buffer o ya subido)', async () => {
    const v = f.contentWindow.__logs.ver();
    return v.parte > 0 || v.buf.some(e => e.tipo === 'carga-pagina');
});
await check('log() acumula eventos con timestamp', async () => {
    log('prueba-evento', { x: 1 });
    const e = __logs.ver().buf.find(e => e.tipo === 'prueba-evento');
    return !!e && !!e.t && e.x === 1;
});
await check('captura crash (evento error, app real)', async () => {
    const w = f.contentWindow;
    const antes = w.__logs.ver().parte;
    w.dispatchEvent(new w.ErrorEvent('error', {
        message: 'boom-prueba', filename: 'x.js', lineno: 3, colno: 4
    }));
    // El manejador sube al instante, y subir() saca el evento del buffer y
    // solo incrementa parte al confirmarse la subida. Se sondea hasta 30 s
    // porque con espera fija hay una ventana en la que no está en ninguna
    // de las dos partes.
    for (let i = 0; i < 30; i++) {
        const v = w.__logs.ver();
        if (v.buf.some(e => e.tipo === 'crash' && e.msg === 'boom-prueba') || v.parte > antes) return true;
        await esperar(1000);
    }
    return false;
});
await check('captura crash-promesa (app real)', async () => {
    const w = f.contentWindow;
    const antes = w.__logs.ver().parte;
    w.dispatchEvent(new w.PromiseRejectionEvent('unhandledrejection', {
        promise: w.Promise.resolve(),
        reason: new w.Error('promesa-mala')
    }));
    for (let i = 0; i < 30; i++) {
        const v = w.__logs.ver();
        if (v.buf.some(e => e.tipo === 'crash-promesa' && e.msg === 'promesa-mala') || v.parte > antes) return true;
        await esperar(1000);
    }
    return false;
});
await check('tope de buffer <= 300', async () => {
    for (let i = 0; i < 500; i++) log('relleno');
    return __logs.ver().buf.length <= 300;
});
await check('subir() no lanza excepción y no pierde eventos si falla', async () => {
    // Se deja un marcador: o la subida se confirma (parte++) o el marcador
    // vuelve al buffer. En ningún caso se pierde en silencio.
    log('marcador-subir', { marca: 1 });
    await __logs.subir();
    for (let i = 0; i < 20; i++) {
        const v = __logs.ver();
        if (v.parte > 0 || v.buf.some(e => e.tipo === 'marcador-subir')) return true;
        await esperar(1000);
    }
    return false;
});

const payload = 'LOGS|' + r.join(' | ');
await fetch('/bc?d=' + encodeURIComponent(payload));
window.__reportado = true;
</script>
</body>
</html>
