<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunWell</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <nav>
            <div class="logo">RunWell</div>
            <ul id='items'>
                <li><a href="#" id="inicio-btn">Inicio</a></li>
                <li><a href="#" id="eventos-btn">Eventos</a></li>
                <li>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </li>
                <li><button id="cta-btn">Empezar</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Transforma tu cuerpo.</h1>
            <p>Rutas personalizadas, Prueba seguimiento en tiempo real y resultados reales.</p>
            <button id="hero-btn">Unete ahora</button>
        </section>
        
        <section id="planes-section" class="planes-section hidden">
            <h2>Próximos Eventos</h2>
            <div class="planes-grid">
                <!-- Se llenará dinámicamente desde script.js -->
            </div>
        </section>
    </main>
    
    <!-- Añade esto después del </main> -->
    <div id="map-container" class="map-hidden">
      <button id="close-map">X</button>
      <button id="locate-btn" title="Mi ubicación">📍</button>
      <div id="map"></div>
    </div>
    
    <!-- Leaflet JS (debe cargarse antes de script.js) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
