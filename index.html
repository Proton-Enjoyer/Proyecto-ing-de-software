<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunWell</title>
    <!-- Estilos por capas (el orden importa: variables → base → resto) -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/mapa.css">
    <link rel="stylesheet" href="css/secciones.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <header>
        <nav>
            <div class="logo">RunWell</div>
            
            <!-- Botón de las 3 líneas (Hamburguesa) para móviles -->
            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <!-- Lista de navegación con la clase nav-links añadida -->
            <ul id="items" class="nav-links">
                <li><a href="#" id="inicio-btn">Inicio</a></li>
                <li><a href="#" id="eventos-btn">Eventos</a></li>
                <li><a href="#" id="historial-btn">Historial</a></li>
                <li>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle">
                        <span class="slider"></span>
                    </label>
                </li>
                <li><button id="cta-btn">Empezar</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="hero">
            <h1>Transforma tu cuerpo.</h1>
            <p>Rutas personalizadas, seguimiento en tiempo real y resultados reales.</p>
            <button id="hero-btn">Unete ahora</button>
        </section>
        
        <section id="planes-section" class="planes-section hidden">
            <h2>Próximos Eventos</h2>
            <div class="planes-grid">
                <!-- Se llenará dinámicamente desde js/eventos.js -->
            </div>
        </section>
        <section id="historial-section" class="planes-section hidden">
    <h2>Historial de Actividades</h2>
    <div id="historial-lista" class="historial-grid"></div>
    <div style="text-align: center; margin-top: 1.5rem;">
      <button id="borrar-historial-btn" class="hidden">Limpiar Historial</button>
    </div>
  </section>
    </main>
    
    <!-- Capa de mapa a pantalla completa (fuera del <main> para no heredar sus estilos) -->
    <div id="map-container" class="map-hidden">
      <button id="close-map">X</button>
      <button id="locate-btn" title="Mi ubicación">📍</button>
      <div id="map"></div>
    </div>

    <!-- Panel flotante: distancia y ritmo en vivo mientras hay actividad -->
    <div id="hud-actividad" class="hud-hidden">
        <div class="hud-cell">
            <span class="hud-valor" id="hud-time">00:00</span>
            <span class="hud-label">Tiempo</span>
        </div>
        <div class="hud-cell">
            <span class="hud-valor" id="hud-dist">0.00</span>
            <span class="hud-label">Kilómetros</span>
        </div>
        <div class="hud-cell">
            <span class="hud-valor" id="hud-ritmo">--:--</span>
            <span class="hud-label">min/km</span>
        </div>
    </div>

    <!-- Prompt de proximidad: aparece cuando estás cerca de una ruta -->
    <div id="proximity-prompt" class="proximity-hidden" role="alertdialog" aria-live="polite">
        <button id="pp-close" class="pp-close" title="Cerrar">✕</button>
        <p class="pp-title">¡Estás en <strong id="pp-ruta">—</strong>!</p>
        <p class="pp-dist" id="pp-dist"></p>
        <p class="pp-sub">¿Qué quieres iniciar?</p>
        <div class="pp-actions">
            <button id="pp-trote" class="pp-btn">🏃 Trote</button>
            <button id="pp-carrera" class="pp-btn pp-btn-alt">⚡ Carrera</button>
        </div>
        <button id="pp-ignorar" class="pp-ignore">Ahora no</button>
    </div>

    <!-- Leaflet JS (global: se carga antes que los módulos de la app) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Módulos ES: el navegador resuelve js/main.js y sus imports -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
